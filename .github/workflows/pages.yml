name: Test and deploy BrowserToneGen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Browser verification
        run: |
          mkdir -p /tmp/btg-preview/browsertonegen
          cp -a index.html styles.css favicon.svg src /tmp/btg-preview/browsertonegen/
          python -m http.server 8000 --directory /tmp/btg-preview &
          for attempt in 1 2 3 4 5; do curl -fsS -o /dev/null http://127.0.0.1:8000/browsertonegen/ && break || sleep 1; done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            docs/BROWSER_RESULTS.json
            docs/*.png
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package static application
        run: |
          mkdir _site
          cp -a index.html styles.css favicon.svg src .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
